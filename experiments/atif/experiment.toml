registry = "../../resources/registry.toml"

[environment_refs]
OPENROUTER_API_KEY = "OPENROUTER_API_KEY"
OPENROUTER_MODEL = "OPENROUTER_MODEL"

[environment]
ABB_MODEL_PROVIDER = "openrouter"
LANGSMITH_TRACING = "false"

[[cases]]
name = "langgraph-two-children"
agent_id = "mini-opencode"
adapters = ["deepagents"]
prompt = "prompts/two_subagents_files.txt"
task_directory = "atif-files"
timeout = 900
attempts = 1
minimum_children = 2
minimum_delegations = 2
absent_files = ["atif-files/alpha/draft.txt", "atif-files/beta/draft.txt"]
files = [{path = "atif-files/alpha/archive/final.txt", content = "ALPHA_CREATED\nALPHA_WRITTEN\n"}, {path = "atif-files/beta/archive/final.txt", content = "BETA_CREATED\nBETA_WRITTEN\n"}]

[[cases]]
name = "acp-two-children"
agent_id = "opencode"
adapters = ["opencode"]
prompt = "prompts/two_subagents_files.txt"
task_directory = "atif-files"
timeout = 900
attempts = 1
minimum_children = 0 # Protocol gaps are reported separately from conversion failure.
minimum_delegations = 2
absent_files = ["atif-files/alpha/draft.txt", "atif-files/beta/draft.txt"]
files = [{path = "atif-files/alpha/archive/final.txt", content = "ALPHA_CREATED\nALPHA_WRITTEN\n"}, {path = "atif-files/beta/archive/final.txt", content = "BETA_CREATED\nBETA_WRITTEN\n"}]

[[cases]]
name = "langgraph-cancel"
agent_id = "mini-opencode"
adapters = ["deepagents"]
prompt = "prompts/cancel.txt"
task_directory = "atif-cancel"
timeout = 300
attempts = 1
cancel_after_deltas = 3
native_config_overrides = [{source = "../../resources/agents/69-mini-opencode/install/abb-config.yaml", target = "/opt/agent/agent/abb-config.yaml", values = {"models.chat_model.streaming" = true}}]
