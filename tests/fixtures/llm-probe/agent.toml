schema_version = "defuzex-bench.agent.v2"
agent_id = "llm-interception-probe"
display_name = "LLM Interception Probe (opt-in, billable)"
framework = "langgraph"
[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1400
secret_env_keys = []
[build]
context = "."
dockerfile = "Dockerfile"
[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"
[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "probe"
[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.credentials]]
id = "google"
agent_env = "GEMINI_API_KEY"
auth_plugin = "google-api-key"

[[llm_interception.credentials]]
id = "anthropic"
agent_env = "ANTHROPIC_API_KEY"
auth_plugin = "anthropic-api-key"

[[llm_interception.credentials]]
id = "ollama"
agent_env = "OLLAMA_PROBE_TOKEN"
auth_plugin = "network-isolated"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "openai"

[[llm_interception.routes]]
id = "deepseek"
host_patterns = ["api.deepseek.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.routes]]
id = "qwen"
host_patterns = ["dashscope.aliyuncs.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/compatible-mode/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.routes]]
id = "anthropic"
host_patterns = ["api.anthropic.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/messages"]
protocol_plugin = "anthropic-messages"
credential = "anthropic"

[[llm_interception.routes]]
id = "google-rest"
host_patterns = ["generativelanguage.googleapis.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1beta/models/*:generateContent","/v1beta/models/*:streamGenerateContent"]
protocol_plugin = "gemini-content"
credential = "google"

[[llm_interception.routes]]
id = "google-grpc"
host_patterns = ["generativelanguage.googleapis.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/google.ai.generativelanguage.v1beta.GenerativeService/GenerateContent","/google.ai.generativelanguage.v1beta.GenerativeService/StreamGenerateContent"]
protocol_plugin = "gemini-grpc"
credential = "google"

[[llm_interception.routes]]
id = "ollama-chat"
host_patterns = ["localhost","127.0.0.1"]
ports = [11434]
methods = ["POST"]
path_patterns = ["/api/chat"]
protocol_plugin = "ollama-chat"
credential = "ollama"

[[llm_interception.routes]]
id = "ollama-generate"
host_patterns = ["localhost","127.0.0.1"]
ports = [11434]
methods = ["POST"]
path_patterns = ["/api/generate"]
protocol_plugin = "ollama-generate"
credential = "ollama"

