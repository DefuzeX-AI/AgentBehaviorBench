schema_version = "defuzex-bench.agent.v2"
agent_id = "interceptor-smoke-agent"
display_name = "Interceptor Smoke Agent"
framework = "fixture"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "/opt/agent/worker.py"]
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 30
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
MODEL_URL = "https://httpbingo.org/anything/source"

[[llm_interception.credentials]]
id = "primary"
agent_env = "MODEL_TOKEN"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "echo-model"
host_patterns = ["httpbingo.org"]
ports = [443]
methods = ["POST"]
path_patterns = ["/anything/source"]
protocol_plugin = "openai-chat"
credential = "primary"

[adapter]
type = "fixture"
