schema_version = "abb.network.v1"

# No explicit tool routes; the model route comes from the shared runtime.
# Keyless web_search uses html.duckduckgo.com (HTTP 502 in local runs).
# web_fetch also rejects non-public resolved addresses before HTTP dispatch;
# ABB synthetic DNS addresses can trigger this even for allowlisted hosts.
# Shell HTTP requests follow their own client path and ABB's egress policy.
# See ../README.md for observed limitations and evidence boundaries.
