# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "zerostack"
display_name = "zerostack"
framework = "acp"

[evaluation]
replay_safe = false

# Fixture workspace (RELEASE_NOTES.md, counter.txt) plus file evidence export. adapter.cwd equals the workspace path.
[evaluation.workspace]
path = "/workspace/project"
initial_state = "fixture"
fixture = "evaluation/fixture"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/gi-dellav/zerostack"
revision = "797dca9c0c4ddb16e09e9707ca17634b13f878ea"
downloaded_on = "2026-10-21"
method = "install"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/agent/abb-acp-launch.py"]
cwd = "/workspace/project"
permission_policy = "allow_once"  # zerostack auto-approves its own tool calls in ACP mode

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
