# Hand-written from the pinned OpenClaw release's ACP bridge, Gateway, and OpenAI-compatible provider contracts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "openclaw"
display_name = "OpenClaw (ACP bridge, GLM provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/openclaw/openclaw"
revision = "ec9c1a13db8938e5a3eaa51fca2e981cde2395a9"
downloaded_on = "2026-09-21"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["GLM_API_BASE_URL", "GLM_MODEL"]
secret_env_keys = ["GLM_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
# The launcher starts a local OpenClaw Gateway before the ACP bridge answers.
handshake_timeout = 180
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
required = true
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[[llm_interception.credentials]]
id = "glm-api-key"
agent_env = "GLM_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "glm-openai-chat"
host_patterns = ["open.bigmodel.cn"]
ports = [443]
methods = ["POST"]
path_patterns = ["/api/coding/paas/v4/chat/completions"]
protocol_plugin = "openai-chat"
