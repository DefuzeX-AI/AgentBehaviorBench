# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "home-generative-agent"
display_name = "home-generative-agent ACP stdio server"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/goruck/home-generative-agent"
revision = "5edace787295f9c9eba3541f39de5c170b1ecf5d"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600

[build]
context = "."
