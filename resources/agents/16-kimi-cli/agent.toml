# Hand-written from the pinned Kimi Code CLI's native ACP server (`kimi acp`) and
# its OpenAI-compatible ("openai_legacy") provider contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "kimi-cli"
display_name = "Kimi Code CLI (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/MoonshotAI/kimi-cli"
revision = "86f136422a0aae6b217ea49e7ea1d2e8a1defcd2"
downloaded_on = "2026-09-21"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
