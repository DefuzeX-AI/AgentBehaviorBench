# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "synergy"
display_name = "Synergy Forge (native ACP)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/SII-Holos/synergy"
revision = "d82f52e4d137831dc3dfdf5ac186c0cb9b5ab584"
downloaded_on = "2026-10-25"
method = "bundled"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
