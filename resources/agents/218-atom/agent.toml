# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "atom"
display_name = "Atom native Meta-Agent"
framework = "acp"

[evaluation]
replay_safe = false

[model]
metadata_paths = ["/models"]

[source]
repository = "https://github.com/rush86999/atom"
revision = "b28ea5c7edbc8e09663a160c2b859e43e26fb7f1"
downloaded_on = "2026-11-22"
method = "bundled"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
