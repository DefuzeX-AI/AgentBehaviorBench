schema_version = "abb.network.v1"

# The upstream international runtime reads the models.dev catalog directly.
[[tool_routes]]
host_patterns = ["models.dev"]
ports = [443]
methods = ["GET"]
path_patterns = ["/api.json"]
purpose = "metadata"

# Keep the original international review operation and verdict observable.
# The Agent owns fallback behavior when its optional title review fails.
[[tool_routes]]
host_patterns = ["agent.minimax.io"]
ports = [443]
methods = ["POST"]
path_patterns = ["/mavis/api/v1/content"]
purpose = "content_safety"
required = false

# Observed HTTP 307 redirect of the existing optional native title-review route.
[[tool_routes]]
host_patterns = ["agent.minimaxi.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/mavis/api/v1/content"]
purpose = "content_safety"
required = false

# Chrome DevTools Protocol of the Agent's headless Chromium on a pinned loopback port.
# The runtime redirects loopback TCP to the interceptor too, so the port is declared
# (HTTP discovery + the WebSocket upgrade are GETs).
[[tool_routes]]
host_patterns = ["127.0.0.1"]
ports = [9222, 9223, 9224, 9225, 9226, 9227, 9228, 9229, 9230, 9231]
methods = ["GET"]
path_patterns = ["/json", "/json/*", "/devtools/*"]
purpose = "tool"
required = false
