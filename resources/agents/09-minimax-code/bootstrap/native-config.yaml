# Native MiniMax configuration for this international API-key deployment; no secrets here.
# The upstream CLI writes the real key at runtime in the private Case directory.
minimax_api:
  baseURL: https://api.minimax.io/anthropic
defaultModel: minimax/MiniMax-M3
# Register the headless `browser` tool (off unless beta.browserUseTooling is set) and
# launch the image's Chromium through the wrapper that trusts the interceptor CA.
beta:
  browserUseTooling: true
browser:
  chromePath: /usr/local/bin/abb-chromium
