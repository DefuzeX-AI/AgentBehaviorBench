# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "mini-opencode"
display_name = "mini-opencode"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/workspace/mini-opencode"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/amszuidas/mini-opencode"
revision = "d09f3e96eca1ac3fb40f7e9ab3740ef67daedc86"
downloaded_on = "2026-10-23"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
optional_secret_env_keys = ["TAVILY_API_KEY", "FIRECRAWL_API_KEY", "BOCHA_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "prompt"
output_key = "answer"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai-deepseek-api-key"
agent_env = "DEEPSEEK_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.deepseek.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/chat/completions", "/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-deepseek-api-key"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]

[[llm_interception.tool_routes]]
host_patterns = ["api.firecrawl.dev"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/scrape", "/v2/scrape"]

[[llm_interception.tool_routes]]
host_patterns = ["api.bochaai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/web-search"]

[[llm_interception.tool_routes]]
host_patterns = ["docs.langchain.com"]
ports = [443]
methods = ["GET", "POST", "DELETE"]
path_patterns = ["/mcp"]
