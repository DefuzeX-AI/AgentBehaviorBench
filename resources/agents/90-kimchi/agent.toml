# Hand-written from the pinned kimchi release binary's native ACP server (`kimchi --mode acp`)
# and its Pi models.json custom-provider (OpenAI-compatible) contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "kimchi"
display_name = "kimchi (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/getkimchi/kimchi"
revision = "65dfefb12a177e60942dc8fde87eeabe02d006af"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
