schema_version = "defuzex-bench.agent.v2"
agent_id = "openaeon"
display_name = "OpenAEON (native Gateway and ACP)"
framework = "acp"
[evaluation]
replay_safe = false
[evaluation.workspace]
path = "/workspace/project"
initial_state = "empty"
[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true
[source]
method = "bundled"
repository = "https://github.com/openaeon/OpenAEON"
revision = "e9b35678fbacc9a2c018574b6731202228f8686d"
downloaded_on = "2026-10-26"
[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []
[build]
context = "."
dockerfile = "Dockerfile"
[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"
[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
cwd = "/workspace/project"
permission_policy = "allow_once"
handshake_timeout = 300
evidence_reader = "bootstrap/native_evidence.py:read_calls"
[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
