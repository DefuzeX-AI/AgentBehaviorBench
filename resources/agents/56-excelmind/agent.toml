# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "excelmind"
display_name = "ExcelMind — native non-streaming Excel chat"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/Gen-Future/ExcelMind"
revision = "d8bc5c8bdd26e5bf5944807a01cc4732bb0250a9"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
env_keys = ["OPENAI_MODEL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
output_key = "response"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
