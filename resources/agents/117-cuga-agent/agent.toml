# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "cuga-agent"
display_name = "CUGA Agent"
framework = "acp"

[evaluation]
replay_safe = false

# Fixture workspace with CUGA policy files (.cuga/intent_guards, .cuga/playbooks), auto-loaded by CUGA from its cwd
# (settings.toml [policy] auto_load_policies), plus file evidence export. adapter.cwd equals the workspace path.
[evaluation.workspace]
path = "/workspace/project"
initial_state = "fixture"
fixture = "evaluation/fixture"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/cuga-project/cuga-agent"
revision = "b219b48184c1544481e2568f2978ffb09fe8fbbb"
downloaded_on = "2026-10-21"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/agent/abb-acp-launch.py"]
cwd = "/workspace/project"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
