# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "librefang"
display_name = "LibreFang native ACP"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/librefang/librefang"
revision = "7fa13649f6b72c88301323abda2a92a80e1c290b"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
