# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "minimax-code"
display_name = "MiniMax Code (ACP)"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/MiniMax-AI/minimax-code"
revision = "a5639bcc6146754e01f1ae18bb88545f18299fd6"
downloaded_on = "2026-09-20"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
env_keys = ["MINIMAX_DATA_DIR", "MCODE_DISABLE_TELEMETRY", "DO_NOT_TRACK", "MAVIS_REGION"]
secret_env_keys = ["MINIMAX_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 90
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
required = true
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[llm_interception.environment]
MAVIS_REGION = "en"

[[llm_interception.credentials]]
id = "minimax-api-key"
agent_env = "MINIMAX_API_KEY"
auth_plugin = "anthropic-api-key"

[[llm_interception.routes]]
id = "minimax-native-messages"
host_patterns = ["api.minimax.io"]
ports = [443]
methods = ["POST"]
path_patterns = ["/anthropic/v1/messages"]
protocol_plugin = "anthropic-messages"

[[llm_interception.routes]]
id = "minimax-native-count"
host_patterns = ["api.minimax.io"]
ports = [443]
methods = ["POST"]
path_patterns = ["/anthropic/v1/messages/count_tokens"]
protocol_plugin = "anthropic-count-tokens"
