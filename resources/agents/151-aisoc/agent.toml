# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "aisoc"
display_name = "AiSOC Copilot (outer ACP transport)"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/beenuar/AiSOC"
revision = "71360e1eb3f509452c5db7c6e2fd1370e0676fab"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
