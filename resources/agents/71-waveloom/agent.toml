# Hand-written from the pinned Waveloom binary's native ACP server and its
# OpenAI-compatible / DeepSeek provider settings (docs/acp.en.md, docs/settings.en.md).
schema_version = "defuzex-bench.agent.v2"
agent_id = "waveloom"
display_name = "Waveloom (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/Menfre01/waveloom"
revision = "daccab5d4816803a82eb6eabfe44a68c75bc1f58"
downloaded_on = "2026-10-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1200
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
