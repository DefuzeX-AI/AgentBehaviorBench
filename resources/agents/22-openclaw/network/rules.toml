schema_version = "abb.network.v1"

# OpenClaw's local file and exec tools need no external network routes. The only
# admitted model route is declared in agent.toml [[llm_interception.routes]].
# Update checks, telemetry, the remote model catalog (catalog.openclaw.ai),
# recurring heartbeats and mDNS are disabled by bootstrap/launch.py instead of
# allowlisted.

# Loopback only: `openclaw acp` is a thin ACP bridge over a WebSocket to the
# OpenClaw Gateway, which launch.py starts in the same container on
# 127.0.0.1:18799 (pinned). The bridge opens one WebSocket (HTTP upgrade on
# GET /) and carries all session, prompt and event traffic over it. The runtime
# redirects every non-root TCP connection, loopback included, to the
# interceptor, so without this route the upgrade is rejected as undeclared
# egress. The traffic never leaves the container.
[[tool_routes]]
host_patterns = ["127.0.0.1"]
ports = [18799]
methods = ["GET"]
path_patterns = ["/"]
purpose = "tool"
required = false

# The Gateway's post-ready dashboard prewarm (listManagedPlugins) fetches the
# public ClawHub plugin catalog feed. v2026.9.5 has no config or env switch for
# this call (only an internal `offline` parameter the prewarm does not pass); on
# failure OpenClaw falls back to its bundled catalog, so the call is optional.
[[tool_routes]]
host_patterns = ["clawhub.ai"]
ports = [443]
methods = ["GET"]
path_patterns = ["/v1/feeds/plugins"]
purpose = "metadata"
required = false

# web_search / web_extract through the official @openclaw/tavily-plugin (installed at
# build time; launch.py selects it as the web search provider).
[[tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search", "/extract"]
purpose = "tool"
required = false

# Chrome DevTools Protocol of the Agent's headless Chromium on a pinned loopback port.
# The runtime redirects loopback TCP to the interceptor too, so the port is declared
# (HTTP discovery + the WebSocket upgrade are GETs).
[[tool_routes]]
host_patterns = ["127.0.0.1"]
ports = [18810]
methods = ["GET", "PUT"]
path_patterns = ["/json", "/json/*", "/devtools/*"]
purpose = "tool"
required = false
