# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "coddy"
display_name = "Coddy (native ACP)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/coddy-project/coddy-agent"
revision = "82e994b5ca32904412c561002dfda28650632af0"
downloaded_on = "2026-10-23"
method = "install"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[model]
metadata_paths = ["/models"]

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
