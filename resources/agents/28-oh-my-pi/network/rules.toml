schema_version = "abb.network.v1"

# omp's local read/write/edit/bash tools need no network routes. The only admitted
# model route is declared in agent.toml [[llm_interception.routes]].

# web_search walks omp's provider chain: Tavily when TAVILY_API_KEY is supplied
# (optional_secret_env_keys), then keyless providers. The keyless DuckDuckGo HTML
# provider (web/search/providers/duckduckgo.ts, POST /html/) is declared too, so
# search works without a key. Other keyless scrapers, fetch and npm installs go to
# ABB's egress observer, which admits the package registries and records
# everything else as refused (403) without rejecting the Case.
[[tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
purpose = "tool"
required = false

[[tool_routes]]
host_patterns = ["html.duckduckgo.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/html/"]
purpose = "tool"
required = false

# Chrome DevTools Protocol of the Agent's headless Chromium on a pinned loopback port.
# The runtime redirects loopback TCP to the interceptor too, so the port is declared
# (HTTP discovery + the WebSocket upgrade are GETs).
[[tool_routes]]
host_patterns = ["127.0.0.1"]
ports = [9222, 9223, 9224, 9225, 9226, 9227, 9228, 9229, 9230, 9231]
methods = ["GET"]
path_patterns = ["/json", "/json/*", "/devtools/*"]
purpose = "tool"
required = false
