# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "openagents"
display_name = "openagents ACP stdio server"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/OpenAgentsInc/openagents"
revision = "96aabb4f57398a3b0eca7111e79d066bffa294b1"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

credentials = []
routes = []

[model]
provider = "openrouter"
reason = "Native Microcoder uses OpenRouter Chat Completions at a fixed URL; use the existing shared replace policy and the configured OpenRouter target."
