schema_version = "defuzex-bench.agent.v2"
agent_id = "saga"
display_name = "SAGA native authoring workflow"
framework = "acp"
[evaluation]
replay_safe = false
[source]
repository = "https://github.com/Lanerra/saga"
revision = "56cba19fa2ae51ab06d06774e2493ebf2ed88a78"
method = "git"
[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
[build]
context = "."
dockerfile = "Dockerfile"
[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"
[adapter]
type = "acp"
transport = "stdio"
env_keys = ["TIKTOKEN_CACHE_DIR", "OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS"]
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"
[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
