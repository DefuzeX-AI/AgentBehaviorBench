# Hand-written from the pinned siGit Code release's native ACP server (`sigit --acp`)
# and its OpenAI-compatible provider override contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "sigit"
display_name = "siGit Code (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/getsigit/sigit"
revision = "e0ec5cf381ae09df66ad0cc33aa1c16afd97a23f"
downloaded_on = "2026-10-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
