schema_version = "abb.network.v1"

# siGit Code's built-in developer tools (read_file, write_file, edit_file,
# list_directory, run_command) are local and need no network routes. Its
# official MCP server is disabled by bootstrap/launch.py (SIGIT_MCP_OFFICIAL=off)
# and on-device telemetry is disabled (ONDE_DISABLE_PULSE=1), so the only
# admitted model route is the one declared in agent.toml via the shared runtime
# default (POST <selected-base>/chat/completions).
