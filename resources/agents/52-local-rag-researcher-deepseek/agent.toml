# Manual ABB integration for kaymen99/local-rag-researcher-deepseek.
# OpenRouter json_schema generation was unavailable on DeepSeek direct API;
# files follow validated LangGraph unit conventions used by ready Agents.
schema_version = "defuzex-bench.agent.v2"
agent_id = "local-rag-researcher-deepseek"
display_name = "Local RAG Researcher (DeepSeek)"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/kaymen99/local-rag-researcher-deepseek"
revision = "98e83829a7e506b1092e90467245e0caed686331"
downloaded_on = "2026-10-06"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["OPENAI_MODEL"]
optional_secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "rag_researcher"
input_key = "user_instructions"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
