schema_version = "defuzex-bench.agent.v2"
agent_id = "local-deep-research"
display_name = "Local Deep Research (langgraph-agent strategy)"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/LearningCircuit/local-deep-research"
revision = "ede8a7b4a8ac746db176285e1075f327e188be00"
downloaded_on = "2026-09-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 3000
secret_env_keys = []
# Optional: enables the Tavily search engine as an extra agent tool.
optional_secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
# Writable state (HOME, LDR data dir, caches) lives under /tmp; see Dockerfile.
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "query"
output_key = "answer"
binding = "ldr_bridge.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

# Search engines offered to the agent (upstream agent_enabled defaults, keyless unless noted).
# Wikipedia (python `wikipedia` package: MediaWiki API, first over http then the https redirect
# target) is the primary web_search engine; its /wiki/ pages are also fetch_content targets.
[[llm_interception.tool_routes]]
host_patterns = ["en.wikipedia.org"]
ports = [80, 443]
methods = ["GET"]
path_patterns = ["/w/api.php", "/wiki/*"]

[[llm_interception.tool_routes]]
host_patterns = ["en.wikinews.org"]
ports = [443]
methods = ["GET"]
path_patterns = ["/w/api.php", "/wiki/*"]

# arXiv: metadata API and abstract/PDF pages.
[[llm_interception.tool_routes]]
host_patterns = ["export.arxiv.org", "arxiv.org"]
ports = [80, 443]
methods = ["GET"]
path_patterns = ["/api/query", "/abs/*", "/pdf/*"]

# PubMed: E-utilities search/summary/fetch, article and PMC pages.
[[llm_interception.tool_routes]]
host_patterns = ["eutils.ncbi.nlm.nih.gov"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/entrez/eutils/*"]

[[llm_interception.tool_routes]]
host_patterns = ["pubmed.ncbi.nlm.nih.gov"]
ports = [443]
methods = ["GET"]
path_patterns = ["/1*", "/2*", "/3*", "/4*", "/5*", "/6*", "/7*", "/8*", "/9*"]

[[llm_interception.tool_routes]]
host_patterns = ["www.ncbi.nlm.nih.gov", "pmc.ncbi.nlm.nih.gov"]
ports = [443]
methods = ["GET"]
path_patterns = ["/pmc/articles/*", "/articles/*"]

[[llm_interception.tool_routes]]
host_patterns = ["api.openalex.org"]
ports = [443]
methods = ["GET"]
path_patterns = ["/works*"]

[[llm_interception.tool_routes]]
host_patterns = ["api.semanticscholar.org"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/graph/v1/*"]

# Wayback Machine: availability, CDX search and archived pages.
[[llm_interception.tool_routes]]
host_patterns = ["archive.org"]
ports = [443]
methods = ["GET"]
path_patterns = ["/wayback/available"]

[[llm_interception.tool_routes]]
host_patterns = ["web.archive.org"]
ports = [443]
methods = ["GET"]
path_patterns = ["/cdx/search/cdx", "/web/*"]

# Tavily (only when TAVILY_API_KEY is supplied).
[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
