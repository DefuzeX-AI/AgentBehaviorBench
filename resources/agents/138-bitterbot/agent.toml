# Generated from pinned Bitterbot source facts and native ACP/Gateway configuration.
schema_version = "defuzex-bench.agent.v2"
agent_id = "bitterbot"
display_name = "Bitterbot (native ACP and private Gateway)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "git"
repository = "https://github.com/Bitterbot-AI/bitterbot-desktop"
revision = "733b741952b627b1ca34aa892a8d1b4a9333e7b6"
downloaded_on = "2026-10-27"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
memory = "2g"
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
# The launcher starts a local Bitterbot Gateway before the ACP bridge answers.
handshake_timeout = 240
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
