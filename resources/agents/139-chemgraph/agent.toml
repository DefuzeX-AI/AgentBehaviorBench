# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "chemgraph"
display_name = "ChemGraph computational chemistry"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/argonne-lcf/ChemGraph"
revision = "d96e7cb83f016865f3bf1969eed821378b57976e"
downloaded_on = "2026-10-28"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["OPENAI_MODEL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "request"
output_key = "answer"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["pubchem.ncbi.nlm.nih.gov"]
ports = [443]
methods = ["POST"]
path_patterns = ["/rest/pug/compound/name/JSON"]
