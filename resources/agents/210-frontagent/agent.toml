# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "frontagent"
display_name = "frontagent ACP stdio server"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/ceilf6/FrontAgent"
revision = "01dc232261b8c64c190f441889d25008ad1f42d8"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
env_keys = ["OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "TOKENIZERS_PARALLELISM"]
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
[[llm_interception.tool_routes]]
host_patterns = ["github.com"]
ports = [443]
methods = ["GET", "HEAD", "POST"]
path_patterns = ["/ceilf6/Lab.git/info/refs*", "/ceilf6/Lab.git/git-upload-pack", "/ceilf6/Lab/info/refs*", "/ceilf6/Lab/git-upload-pack"]
purpose = "tool"
