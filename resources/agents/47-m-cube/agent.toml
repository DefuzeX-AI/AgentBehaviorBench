# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "m-cube"
display_name = "M-Cube (M³) — Multi-thinking, Multimodal, Multi-verification Patent Drafting Assistant"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/yycyyv/M-Cube"
revision = "75ab640723e19dd612cd13c284c5d6a059e2547b"
downloaded_on = "2026-10-06"

[runtime]
type = "docker"
execution = "oneshot"
# Source-backed justification for 1800s: the draft workflow chains at least
# six LLM-backed nodes plus HITL auto-resume rounds; agents/base_agent.py
# retries each structured LLM call up to RetryPolicy.max_retries=3 while
# services/llm_factory.py defaults each call to LLM_HTTP_TIMEOUT_SECONDS=240,
# so one slow node alone can consume ~720s and the 300s default is
# insufficient here.
timeout_sec = 1800
# LLM_MAX_OUTPUT_TOKENS is intentionally not passed through env_keys (its name
# matches the harness credential pattern); the binding sets a roomier default
# via os.environ.setdefault instead.
env_keys = ["LLM_MODEL", "LLM_VISION_MODEL", "LLM_HTTP_TIMEOUT_SECONDS"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "disclosure_text"
binding = "mcube_draft_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
