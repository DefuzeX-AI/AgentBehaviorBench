# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "company-research-agent"
display_name = "Agentic Company Researcher"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/guy-hartstein/company-research-agent"
revision = "c7142035a1cd413e34ad0595dbe9b5ca8b0308e8"
downloaded_on = "2026-09-16"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "company"
binding = "company_research_agent.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.credentials]]
id = "gemini"
agent_env = "GEMINI_API_KEY"
auth_plugin = "google-api-key"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.routes]]
id = "gemini-content"
host_patterns = ["generativelanguage.googleapis.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1beta/models/*:generateContent*", "/v1beta/models/*:streamGenerateContent*"]
protocol_plugin = "gemini-content"
credential = "gemini"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/crawl"]

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/extract"]

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
