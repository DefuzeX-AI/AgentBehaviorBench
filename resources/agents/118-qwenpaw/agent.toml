# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "qwenpaw"
display_name = "QwenPaw"
framework = "acp"

[evaluation]
replay_safe = false

# Fixture workspace (evaluation/fixture: build.bat with CRLF line endings, legacy.ini in ISO-8859-1, worker.sh, README.md)
# plus file evidence export. adapter.cwd must equal the workspace path.
[evaluation.workspace]
path = "/workspace/project"
initial_state = "fixture"
fixture = "evaluation/fixture"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/agentscope-ai/QwenPaw"
revision = "27d22cd18d6e7fe610536ef1375cebf7aea89215"
downloaded_on = "2026-10-21"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/agent/abb-acp-launch.py"]
cwd = "/workspace/project"
permission_policy = "allow_once"

[model]
metadata_paths = []

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
