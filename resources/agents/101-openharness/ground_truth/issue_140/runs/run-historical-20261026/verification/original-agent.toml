schema_version = "defuzex-bench.agent.v2"
agent_id = "openharness"
display_name = "OpenHarness (native session via ACP transport)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "git"
repository = "https://github.com/zhijiewong/openharness"
revision = "2a7b7b8e1c0b132241d0eebb906dc86863ca19d8"
downloaded_on = "2026-10-24"

[model]
provider = "deepseek"
reason = "User-selected DeepSeek deployment using the native session CLI and runtime-owned model configuration."

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
cwd = "/home/agent/workspace"
permission_policy = "allow_once"
handshake_timeout = 120

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
