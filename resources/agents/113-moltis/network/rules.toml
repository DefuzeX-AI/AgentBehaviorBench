schema_version = "abb.network.v1"

# Moltis's file and exec tools run locally (restricted-host sandbox) and need no
# network routes. The only admitted model route is the shared runtime default
# derived from the selected provider (POST <base>/chat/completions); the model
# list is fixed in the moltis.toml that bootstrap/launch.py writes, so no catalog
# request is made. No web search provider, MCP server, channel or connector is
# configured; web_fetch and web_search have no admitted route.
