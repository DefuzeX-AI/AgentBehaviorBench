# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "podcast"
display_name = "AI-Powered Podcast Creation and Optimization System"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/artnoage/Podcast"
revision = "9d0f3c4e261fb7363ef419639371443febbf0c13"
downloaded_on = "2026-10-08"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
# The three node model ids are read by the binding from these names; unset
# values fall back to the upstream default gpt-4o-mini. No model base URL is
# declared: the binding builds ChatOpenAI with provider="OpenAI", which sets
# none, so the endpoint is owned by the interception layer below.
env_keys = ["PODCAST_SUMMARIZER_MODEL", "PODCAST_SCRIPTWRITER_MODEL", "PODCAST_ENHANCER_MODEL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "podcast_workflow.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
