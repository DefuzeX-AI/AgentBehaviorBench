schema_version = "defuzex-bench.agent.v2"
agent_id = "redcell"
display_name = "REDCELL native session planner"
framework = "acp"
[evaluation]
replay_safe = false
[source]
repository = "https://github.com/martian56/redcell"
revision = "f6dae370731c1c20f32c9407283d7f76901ea93b"
method = "git"
[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
[build]
context = "."
dockerfile = "Dockerfile"
[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"
[adapter]
type = "acp"
transport = "stdio"
env_keys = ["GOMAXPROCS", "OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "TIKTOKEN_CACHE_DIR"]
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"
[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
