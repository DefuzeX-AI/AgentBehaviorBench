# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "ontocast"
display_name = "OntoCast"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/growgraph/ontocast"
revision = "d55cb49d5fb3cc1b8227efebe6891a2de8fcd14c"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["CURRENT_DOMAIN", "PORT", "MAX_VISITS", "RENDER_MODE", "LLM_GRAPH_FORMAT", "LLM_OUTPUT_LAYOUT", "ONTOLOGY_CHAPTER_FORMAT", "ONTOLOGY_CONTEXT_MODE", "ONTOLOGY_CONTEXT_SCOPE", "FANOUT_WARMUP_UNITS", "ONTOLOGY_CONTEXT_MAX_TRIPLES", "ONTOLOGY_CONTEXT_REQUIRED", "PARALLEL_WORKERS", "LLM_PROVIDER", "LLM_MODEL_NAME", "LLM_TEMPERATURE", "CHUNK_MIN_SIZE", "CHUNK_MAX_SIZE", "CHUNK_SECTION_TAG_MIN_CHARS", "FUSEKI_URI", "ONTOCAST_ONTOLOGY_DIRECTORY", "ONTOCAST_CACHE_DIR", "AGG_EMBEDDING_MODEL", "AGG_SIMILARITY_THRESHOLD", "EMBEDDING_PROVIDER", "EMBEDDING_MODEL_NAME", "EMBEDDING_DIMENSION", "QDRANT_URI", "QDRANT_GRPC_PORT", "QDRANT_USE_GRPC", "VECTOR_STORE_TOP_K", "VECTOR_STORE_INDUCED_SUBGRAPH_DEPTH", "VECTOR_STORE_INDUCED_SUBGRAPH_MAX_TOTAL_TRIPLES", "VECTOR_STORE_INDUCED_SUBGRAPH_ESTIMATED_TRIPLES_PER_QUERY"]


[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
input_key = "text"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "LLM_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
