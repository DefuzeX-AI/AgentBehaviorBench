# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "react-agent"
display_name = "LangGraph ReAct Agent Template"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/langchain-ai/react-agent"
revision = "9bbd82d84905acc37f527b1f372dae841016f3b4"
downloaded_on = "2026-09-16"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
binding = "bridge.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "anthropic"
agent_env = "ANTHROPIC_API_KEY"
auth_plugin = "anthropic-api-key"

[[llm_interception.routes]]
id = "anthropic-messages"
host_patterns = ["api.anthropic.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/messages"]
protocol_plugin = "anthropic-messages"
credential = "anthropic"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
