schema_version = "defuzex-bench.agent.v2"
agent_id = "react-agent"
display_name = "02 ReAct Agent"
framework = "langgraph"

[evaluation]
# Configured tools only retrieve Tavily search results; each replay has a new session.
replay_safe = true

[source]
repository = "https://github.com/langchain-ai/react-agent"
revision = "9bbd82d84905acc37f527b1f372dae841016f3b4"
downloaded_on = "2026-09-10"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "react.py:create_graph"

[adapter.context]
# Native provider request; ABB's interceptor selects the actual target model.
model = "openai/gpt-4.1-mini"
max_search_results = 5

[observe]
input_fields = [{ name = "message", label = "用户消息", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
