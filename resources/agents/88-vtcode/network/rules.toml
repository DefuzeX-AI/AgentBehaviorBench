schema_version = "abb.network.v1"

# VT Code's ACP tools (read_file, list_files, apply_patch, exec_command,
# write_stdin) are local and need no network routes. The only admitted model
# route is the shared runtime default derived from the selected provider.
# Update checks are switched off by the update.toml that bootstrap/launch.py
# writes; persistent memories are disabled in its vtcode.toml. No web search,
# web fetch, MCP server or connector is configured in this deployment;
# ripgrep is preinstalled for local search.
