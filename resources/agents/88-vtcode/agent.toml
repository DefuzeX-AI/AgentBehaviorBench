# Hand-written from the pinned VT Code release binary's native ACP server
# (`vtcode acp`) and its OpenAI-compatible custom provider contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "vtcode"
display_name = "VT Code (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/vinhnx/VTCode"
revision = "ea28d48590cf98958885b3c420c5d22d8af82a68"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
