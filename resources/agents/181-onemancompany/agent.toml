# Integration of the native OneManCompany employee executor.
schema_version = "defuzex-bench.agent.v2"
agent_id = "onemancompany"
display_name = "OneManCompany native EA"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/1mancompany/OneManCompany"
revision = "3fde1888941248351e5cfc0b153d9149fda73d81"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "message"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
