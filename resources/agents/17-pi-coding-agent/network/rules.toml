schema_version = "abb.network.v1"

# Pi's local read/write/edit/bash tools need no network routes. Startup network
# operations (version check, install telemetry, package updates, fd/rg downloads)
# are disabled by the launcher with PI_OFFLINE=1. The only admitted model route
# is declared in agent.toml [[llm_interception.routes]].
#
# npm is online: pi-acp's `npm view` update notice and any `npm install` the
# Agent runs reach registry.npmjs.org through ABB's egress observer, whose
# default allowlist includes the package registries.
