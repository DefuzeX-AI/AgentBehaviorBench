schema_version = "abb.network.v1"

# Hermes Agent's local file and terminal tools need no network routes. The only
# admitted model route is declared in agent.toml [[llm_interception.routes]].
# Startup catalog fetches (models.dev, the Nous model catalog, the keyless
# OpenCode relay catalog) are disabled in the per-Case config written by
# bootstrap/launch.py instead of being allowlisted here.
#
# Model metadata, GET only, exact path, optional: Hermes lists the configured
# provider's models with `GET <base_url>/models` in two places that have no
# config switch at v2026.9.14 -- the ACP session model picker at session/new
# (hermes_cli/models.py _profile_live_catalog -> ProviderProfile.fetch_models)
# and per-turn cost estimation (agent/usage_pricing.py get_pricing_entry ->
# agent/model_metadata.py fetch_endpoint_model_metadata). Each runs at most once
# per process (memoized). Both fall back to the bundled catalog / "unknown cost"
# when the call fails, so the route is not required for a turn to complete.
[[tool_routes]]
host_patterns = ["open.bigmodel.cn"]
ports = [443]
methods = ["GET"]
path_patterns = ["/api/coding/paas/v4/models"]
purpose = "metadata"
required = false
