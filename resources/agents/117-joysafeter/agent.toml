# Integration of the native JoySafeter DeepAgents Copilot runner.
schema_version = "defuzex-bench.agent.v2"
agent_id = "joysafeter"
display_name = "JoySafeter native Copilot"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/jd-opensource/JoySafeter"
revision = "12234a11a9d96acef85577afb1fa5682169d6171"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "message"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
