# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "timeseriesscientist"
display_name = "TimeSeriesScientist"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/Y-Research-SBU/TimeSeriesScientist"
revision = "41b396316fee25462c56cb53635b42660042d890"
downloaded_on = "2026-10-03"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 3600
env_keys = ["TSCI_DATA_PATH", "TSCI_MODEL_MAX_CALLS", "TSCI_MODEL_OUTPUT_LIMIT", "TSCI_REASONING_EFFORT", "TSCI_DEPLOY_NUM_SLICES", "TSCI_DEPLOY_INPUT_LENGTH", "TSCI_DEPLOY_HORIZON", "TSCI_DEPLOY_K_MODELS"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "request"
binding = "tsci_workflow.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
