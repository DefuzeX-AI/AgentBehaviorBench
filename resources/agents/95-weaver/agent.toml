# Generated by BBA from validated configuration facts (manual completion).
schema_version = "defuzex-bench.agent.v2"
agent_id = "weaver"
display_name = "Weaver — LangGraph Research Agent"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/skygazer42/Weaver"
revision = "745693afbf1e8a5b68dad5f616b2681cb2042ee9"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
# The research graph chains planner -> parallel search -> writer ->
# evaluator/reviser loops; a text-only run can still take minutes, so 1800s
# (the deployment default of 300s is insufficient for multi-node research).
timeout_sec = 1800
env_keys = ["LLM_MODEL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "input"
binding = "weaver_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"