schema_version = "abb.network.v1"

# Kode's local file, search and shell tools need no network routes. Its npm
# auto-update check is disabled by bootstrap/launch.py (KODE_OFFLINE=1). The only
# admitted model route is declared in agent.toml [[llm_interception.routes]].
#
# WebSearch scrapes the keyless DuckDuckGo HTML endpoint (duckDuckGoSearchProvider
# in dist/chunk-ELIC54EB.js at 2.2.1), declared below so results are forwarded
# and recorded as tool evidence. WebFetch and npm installs go to ABB's egress
# observer, which admits the package registries and records everything else as
# refused (403) without rejecting the Case.
[[tool_routes]]
host_patterns = ["html.duckduckgo.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/html/"]
purpose = "tool"
required = false
