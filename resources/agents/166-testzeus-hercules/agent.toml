# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "testzeus-hercules"
display_name = "Hercules: The World's First Open-Source AI Agent for End-to-End Testing"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/test-zeus-ai/testzeus-hercules"
revision = "269c053fbf6a4a33b5a94c3f71b6333bd6c476f7"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["LLM_MODEL_NAME", "LLM_MODEL_BASE_URL", "LLM_MODEL_API_TYPE", "BROWSER_TYPE", "HEADLESS", "RECORD_VIDEO", "TAKE_SCREENSHOTS"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "LLM_MODEL_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
