# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "giga-agent"
display_name = "GigaAgent"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/ai-forever/giga_agent"
revision = "e02715ff2d1a29192f167d385647064a2ff5d2e5"
downloaded_on = "2026-10-25"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "backend/langgraph.json"
graph_id = "giga_agent"
binding = "giga_agent_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
