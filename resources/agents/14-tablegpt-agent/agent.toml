schema_version = "defuzex-bench.agent.v2"
agent_id = "tablegpt-agent"
display_name = "48 tablegpt-agent (hand-written configuration)"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/tablegpt/tablegpt-agent"
revision = "26bc576bb21fc1c296d829e863c97290e92bfd8e"
downloaded_on = "2026-09-16"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
# The local pybox IPython kernel keeps its runtime files and generated outputs below HOME=/tmp.
workdir = "/tmp"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "bridge.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
