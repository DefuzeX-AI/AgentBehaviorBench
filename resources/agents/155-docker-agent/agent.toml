# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "docker-agent"
display_name = "docker-agent ACP stdio server"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/docker/docker-agent"
revision = "67cb28ead03a37d064029d4cbccebef2fb79c9a9"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["docker-agent", "serve", "acp", "/opt/agent/bootstrap/agent.yaml"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
