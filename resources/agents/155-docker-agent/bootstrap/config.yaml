# Replace only the built-in agent's smart model. Native instructions and tools stay intact.
# docker-agent expands model/base_url variables and resolves token_key at runtime.
smart:
  provider: openai
  model: ${ABB_AGENT_MODEL}
  base_url: ${ABB_AGENT_MODEL_BASE_URL}
  token_key: ABB_AGENT_MODEL_API_KEY
  provider_opts:
    api_type: openai_chatcompletions
