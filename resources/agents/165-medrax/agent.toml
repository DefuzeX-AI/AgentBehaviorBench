# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "medrax"
display_name = "MedRAX: Medical Reasoning Agent for Chest X-ray"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/bowang-lab/MedRAX"
revision = "d243cc50348fa0f0c219cc623e2cf26b906be676"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["OPENAI_BASE_URL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "message"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

# Native TorchXRayVision checkpoints and this repository's release-asset CDN.
[[llm_interception.tool_routes]]
host_patterns = ["github.com"]
ports = [443]
methods = ["GET", "HEAD"]
path_patterns = ["/mlmed/torchxrayvision/releases/download/v1/*.pt"]
purpose = "tool"

[[llm_interception.tool_routes]]
host_patterns = ["release-assets.githubusercontent.com"]
ports = [443]
methods = ["GET", "HEAD"]
path_patterns = ["/github-production-release-asset/244798181/*"]
purpose = "tool"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
