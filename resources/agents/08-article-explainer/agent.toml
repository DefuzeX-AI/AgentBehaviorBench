schema_version = "defuzex-bench.agent.v2"
agent_id = "article-explainer"
display_name = "09 Article Explainer"
framework = "langgraph"

[evaluation]
# Only model reasoning and native internal handoff tools; no external writes.
replay_safe = true

[source]
repository = "https://github.com/duartecaldascardoso/article-explainer"
revision = "2cf067dc4b9158b03361c7b3e2544e067b75f1ae"
downloaded_on = "2026-09-14"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "message"
binding = "article_binding.py:create_graph"

[observe]
input_fields = [{name = "message", label = "Current article excerpt and question", required = true}]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
