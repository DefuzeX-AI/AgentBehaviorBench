schema_version = "abb.network.v1"

# Hermes Agent's local file and terminal tools need no network routes. The only
# admitted model route is declared in agent.toml [[llm_interception.routes]].
# Startup catalog fetches (models.dev, the Nous model catalog, the keyless
# OpenCode relay catalog) are disabled in the per-Case config written by
# bootstrap/launch.py instead of being allowlisted here.
#
# Optional model-list metadata routes follow the selected provider via [model].

# `web_search` and `web_extract` use Tavily when TAVILY_API_KEY is supplied (optional_secret_env_keys).
[[tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search", "/extract"]
purpose = "tool"
required = false

# Chrome DevTools Protocol of the Agent's headless Chromium on a pinned loopback port.
# The runtime redirects loopback TCP to the interceptor too, so the port is declared
# (HTTP discovery + the WebSocket upgrade are GETs).
[[tool_routes]]
host_patterns = ["127.0.0.1"]
ports = [9222]
methods = ["GET"]
path_patterns = ["/json", "/json/*", "/devtools/*"]
purpose = "tool"
required = false
