# Hand-written from the pinned Hermes Agent's native ACP adapter (`hermes acp`) and shared model provider contracts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "hermes-agent"
display_name = "Hermes Agent (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/NousResearch/hermes-agent"
revision = "f97608f178d1ffeca59860195ab7da295f7c8e5f"
downloaded_on = "2026-10-08"

# metadata_paths admits GET <selected-base>/models for the native model picker/pricing lookup.
[model]
metadata_paths = ["/models"]

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []
# Optional: Tavily backend for the web search tools (see network/rules.toml).
optional_secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
