# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "deer-flow"
display_name = "DeerFlow"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/workspace/deerflow"
initial_state = "empty"

[source]
repository = "https://github.com/bytedance/deer-flow"
revision = "a1eb3971412ee269f1f89bfb5cc9e158b682f86e"
downloaded_on = "2026-10-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "deerflow_client.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
