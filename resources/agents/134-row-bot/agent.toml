schema_version = "defuzex-bench.agent.v2"
agent_id = "row-bot"
display_name = "Row-Bot (LangGraph headless filesystem+calculator)"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "git"
repository = "https://github.com/siddsachar/row-bot"
revision = "e026b84bfc9f7c65ba87ae8f608e3d3dbaf1327f"
downloaded_on = "2026-10-26"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
cpus = 2
env_keys = ["OPENAI_BASE_URL", "OPENAI_MODEL"]
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
input_key = "message"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/chat/completions", "/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
