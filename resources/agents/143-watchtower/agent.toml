# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "watchtower"
display_name = "Watchtower"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/fzn0x/watchtower"
revision = "a854009ce9bf766d23fc2d0d484342e0bbbeb247"
downloaded_on = "2026-10-20"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
# Optional local acceptance settings; both are unset in normal runs.
# WATCHTOWER_TOOLS is the native tool selection (comma-separated, default all);
# WATCHTOWER_LOOPBACK_FIXTURE=1 starts evaluation/local/fixture on 127.0.0.1:8000.
env_keys = ["WATCHTOWER_TOOLS", "WATCHTOWER_LOOPBACK_FIXTURE"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "watchtower_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai-openrouter-api-key"
agent_env = "OPENROUTER_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["openrouter.ai"]
ports = [443]
methods = ["POST"]
path_patterns = ["/api/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-openrouter-api-key"
