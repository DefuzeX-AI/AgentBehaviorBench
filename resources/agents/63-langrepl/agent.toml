# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "langrepl"
display_name = "langrepl — native general agent"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/workspace/langrepl"
initial_state = "empty"

[source]
repository = "https://github.com/midodimori/langrepl"
revision = "b0d3780878441ee33d10062b040e5415c8b5da59"
downloaded_on = "2026-10-23"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
output_key = "response"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai-llm--openai-api-key"
agent_env = "LLM__OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-llm--openai-api-key"
