# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "kimi-code"
display_name = "kimi-code ACP stdio server"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/MoonshotAI/kimi-code"
revision = "83e4dde93453dd22e89da03d2c96d84999e7d0c2"
downloaded_on = "2026-11-22"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/start.py"]
cwd = "/workspace"
permission_policy = "deny"

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
