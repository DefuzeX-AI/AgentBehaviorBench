schema_version = "defuzex-bench.agent.v2"
agent_id = "readwren"
display_name = "121 readwren (hand-written configuration)"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/muratcankoylan/readwren"
revision = "3d0bfe481a340f247c749c082b7a65c877c12de1"
downloaded_on = "2026-09-16"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
# /opt/agent is read-only in the container; /tmp is writable.
workdir = "/tmp"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "bridge.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "moonshot"
agent_env = "MOONSHOT_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "moonshot-chat"
host_patterns = ["api.moonshot.ai"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "moonshot"
