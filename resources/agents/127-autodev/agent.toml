schema_version = "defuzex-bench.agent.v2"
agent_id = "autodev"
display_name = "AutoDev Xiuper (native ACP)"
framework = "acp"
[evaluation]
replay_safe = false
[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"
[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true
[source]
method = "install"
repository = "https://github.com/phodal/auto-dev"
revision = "47f9aab58f023dc777fbb5f3c71c539fa0a40a82"
downloaded_on = "2026-10-26"
[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
cpus = 2
env_keys = []
[build]
context = "."
dockerfile = "Dockerfile"
[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"
[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"
[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
