schema_version = "defuzex-bench.agent.v2"
agent_id = "open-deepthink"
display_name = "open-deepthink (LangGraph QNN, DeepSeek provider)"
framework = "langgraph"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "git"
repository = "https://github.com/godelcomplete9/open-deepthink"
revision = "b440af10fd8fc9550b3a70fc76761465aede7a4b"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800.0

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "user_prompt"
output_key = "proposed_solution"
binding = "open_deepthink_bridge.py:create_graph"

[adapter.context]
qnn_mode = "manual"
manual_layers = 1
manual_width = 2
num_epochs = 2

[llm_interception]
network_config = "network/rules.toml"
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "deepseek-api-key"
agent_env = "DEEPSEEK_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "deepseek-chat"
host_patterns = ["api.deepseek.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/chat/completions", "/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "deepseek-api-key"

[[llm_interception.credentials]]
id = "openai-openrouter-api-key"
agent_env = "OPENROUTER_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["openrouter.ai"]
ports = [443]
methods = ["POST"]
path_patterns = ["/api/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-openrouter-api-key"
