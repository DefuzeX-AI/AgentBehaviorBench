# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "open-deepthink"
display_name = "open-deepthink"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/iblameandrew/open-deepthink"
revision = "b440af10fd8fc9550b3a70fc76761465aede7a4b"
downloaded_on = "2026-10-07"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800.0

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "user_prompt"
output_key = "proposed_solution"
binding = "open_deepthink_bridge.py:create_graph"

[adapter.context]
qnn_mode = "manual"
manual_layers = 1
manual_width = 2
num_epochs = 2

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai-openrouter-api-key"
agent_env = "OPENROUTER_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["openrouter.ai"]
ports = [443]
methods = ["POST"]
path_patterns = ["/api/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-openrouter-api-key"
