# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "ai-find-customer"
display_name = "AI Hunter"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/xiongQvQ/AI_Find_Customer"
revision = "9b2fde8f719623c627516da2663707a893ee6805"
downloaded_on = "2026-10-05"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
# OPENAI_API_BASE is intentionally NOT declared in env_keys: litellm honours it,
# so a host-provided value would send model traffic straight to that URL and
# bypass the api.openai.com interception route above, leaving those calls
# unrecorded. The model endpoint is owned by the interception layer.
env_keys = ["LLM_MODEL", "REASONING_MODEL"]
secret_env_keys = ["SERPER_API_KEY"]
optional_secret_env_keys = ["JINA_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
input_key = "description"
binding = "bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["google.serper.dev"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search", "/maps"]

[[llm_interception.tool_routes]]
host_patterns = ["r.jina.ai"]
ports = [443]
methods = ["GET"]
# The upstream JinaReaderTool builds every request as
# f"https://r.jina.ai/{url}" (JINA_BASE + the target URL), so the request path is
# always "/" followed by the target scheme, i.e. /https://<host>/... or
# /http://<host>/... . fnmatch matches whole strings, so an exact "/https:/"
# pattern only matches a path that is literally "/https:/"; the trailing
# "/*" forms below are what actually match. Not verified against a real
# JINA_API_KEY run.
path_patterns = ["/https:*", "/http:*"]
