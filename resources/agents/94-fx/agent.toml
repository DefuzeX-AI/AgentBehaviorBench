# Hand-written from the pinned fx binary's ACP server (`fx acp`) and a configured
# `openai-chat-completions` connection pointed at a loopback model relay.
schema_version = "defuzex-bench.agent.v2"
agent_id = "fx"
display_name = "fx (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/vercel-labs/fx"
revision = "1a070af32cdfaf8cd0da6de3dc7f053302828b17"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1200
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
