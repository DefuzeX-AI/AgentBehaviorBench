# Hand-written from the pinned ZeroClaw release binary's native ACP server (`zeroclaw acp`) and its OpenAI-compatible `custom` provider slot.
schema_version = "defuzex-bench.agent.v2"
agent_id = "zeroclaw"
display_name = "ZeroClaw (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/zeroclaw-labs/zeroclaw"
revision = "c473221313341a853e04122f93bb9bd26b5e6c47"
downloaded_on = "2026-10-25"

[runtime]
optional_secret_env_keys = ["TAVILY_API_KEY"]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
