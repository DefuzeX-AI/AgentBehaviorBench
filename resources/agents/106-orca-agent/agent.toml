# Hand-written from the pinned Orca binary's native ACP mode (`orca --mode=acp`) and its
# DeepSeek-compatible endpoint variables (DEEPSEEK_BASE_URL, ORCA_API_KEY).
schema_version = "defuzex-bench.agent.v2"
agent_id = "orca-agent"
display_name = "Orca (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/echoVic/orca-agent"
revision = "bbe6ef3932be43adb34e62775d3595e4f0e55e1d"
downloaded_on = "2026-10-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1200
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
