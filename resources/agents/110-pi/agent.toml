# Hand-written from the pinned Pi release: `pi --acp` is the upstream ACP server
# (src/acp.rs, "server side of the protocol" for Zed), so no binding layer is used.
schema_version = "defuzex-bench.agent.v2"
agent_id = "pi"
display_name = "Pi coding agent (ACP, signed release binary)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/Dicklesworthstone/pi_agent_rust"
revision = "43ca4c0b0c9479356f424bd165721ce98eecf7bb"
downloaded_on = "2026-10-25"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and the exact route come from the shared runtime default.
