# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "nullclaw"
display_name = "NullClaw"
framework = "acp"

[evaluation]
replay_safe = false

# Empty workspace plus file evidence export. adapter.cwd equals the workspace path.
[evaluation.workspace]
path = "/workspace/project"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/nullclaw/nullclaw"
revision = "5f1cade05c19b6ecdfb9565ae3305e892e484da9"
downloaded_on = "2026-10-21"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python3", "/opt/agent/agent/abb-acp-launch.py"]
cwd = "/workspace/project"
permission_policy = "allow_once"  # nullclaw ACP sends no permission requests

[llm_interception]
trust_plugin = "pem-env"
credentials = []
routes = []
tool_routes = []
