# Generated for DefuzeX ABB Issue #383 (PosterGen Onboarding)
schema_version = "defuzex-bench.agent.v2"
agent_id = "postergen"
display_name = "PosterGen: Multi-Agent Paper-to-Poster Generation"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/Y-Research-SBU/PosterGen"
revision = "8a54325f871ee10fa6545de3b3a9b771aa12620c"
downloaded_on = "2026-10-17"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["OPENAI_MODEL"]
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
output_key = "final_output"

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
