# Hand-written from the pinned oh-my-pi release's native ACP server (`omp acp`) and its custom-provider (models.yml) contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "oh-my-pi"
display_name = "oh-my-pi (omp native ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/can1357/oh-my-pi"
revision = "e4151593ace2781d1dc2f06d760301f88af3e9dc"
downloaded_on = "2026-09-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []
# Optional: Tavily backend for omp's web_search tool (see network/rules.toml).
optional_secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
