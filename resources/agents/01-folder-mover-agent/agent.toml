# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "folder-mover-agent"
display_name = "Folder Mover Agent"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "C:\\Song_startup\\benchmark\\04-folder-mover-agent\\folder-mover-agent"
revision = "sha256:2826f61d2e9be0c7a751d6a5fa22b169895d6b74bdcecd77be07d08a7d6b52cd"
downloaded_on = "2026-09-18"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["OPENAI_MODEL"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "folder-mover"
input_key = "message"
binding = "bridge.py:create_graph"

[llm_interception]
required = true
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
