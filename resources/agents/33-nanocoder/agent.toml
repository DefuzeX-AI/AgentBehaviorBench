# Hand-written from the pinned @nanocollective/nanocoder package's native ACP server (`nanocoder --acp`) and its OpenAI-compatible provider config.
schema_version = "defuzex-bench.agent.v2"
agent_id = "nanocoder"
display_name = "Nanocoder (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/Nano-Collective/nanocoder"
revision = "59874391f939bdfe93c273a10d23a7a94009edd1"
downloaded_on = "2026-09-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

# Model credentials and exact routes use the shared runtime default.
