schema_version = "defuzex-bench.agent.v2"
agent_id = "gpt-researcher"
display_name = "04 GPT Researcher"
framework = "langgraph"

[source]
repository = "https://github.com/assafelovic/gpt-researcher"
revision = "6f998577d547b1e54ec662dac63583aa11e3b84b"
downloaded_on = "2026-09-14"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "query"
output_key = "answer"
binding = "research.py:create_graph"

[observe]
input_fields = [{ name = "query", label = "Academic research question", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["export.arxiv.org", "arxiv.org", "www.arxiv.org"]
ports = [80, 443]
methods = ["GET", "HEAD"]
path_patterns = ["/api/*", "/pdf/*", "/abs/*", "/html/*"]
