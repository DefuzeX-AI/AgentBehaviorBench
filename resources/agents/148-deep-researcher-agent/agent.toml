# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "deep-researcher-agent"
display_name = "NVIDIA Deep Researcher Agent (native NAT workflow)"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/NVIDIA-AI-Blueprints/deep-researcher-agent"
revision = "951a1a1114e9818073ddbe2a5fdbfa824751f4d3"
downloaded_on = "2026-10-27"
method = "bundled"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1200
optional_secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
input_key = "message"
output_key = "response"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]
