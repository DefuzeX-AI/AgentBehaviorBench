# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "omniwriter"
display_name = "OmniWriter"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/twanew/OmniWriter"
revision = "2d0aedc00552795bfa366fcbc123888042493dea"
downloaded_on = "2026-10-16"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800
env_keys = ["LLM_BASE_URL", "EMBEDDING_BASE_URL", "EMBEDDING_MODEL"]
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
binding = "omniwriter_bridge.py:create_graph"
input_key = "topic"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"

[[llm_interception.credentials]]
id = "openai-llm-base-api-key"
agent_env = "LLM_BASE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.credentials]]
id = "openai-embedding-base-api-key"
agent_env = "EMBEDDING_BASE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["ark.cn-beijing.volces.com"]
methods = ["POST"]
path_patterns = ["/api/coding/v3/chat/completions"]
ports = [443]
protocol_plugin = "openai-chat"
credential = "openai-llm-base-api-key"

[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
methods = ["POST"]
path_patterns = ["/search"]
ports = [443]
