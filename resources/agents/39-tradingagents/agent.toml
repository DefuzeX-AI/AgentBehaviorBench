# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "tradingagents"
display_name = "TradingAgents"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/TauricResearch/TradingAgents"
revision = "8b22d43d01d9ddda5d686d093d5385884622f3de"
downloaded_on = "2026-10-01"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["TRADINGAGENTS_LLM_PROVIDER", "TRADINGAGENTS_LLM_BACKEND_URL", "TRADINGAGENTS_DEEP_THINK_LLM", "TRADINGAGENTS_QUICK_THINK_LLM", "TRADINGAGENTS_MAX_DEBATE_ROUNDS", "TRADINGAGENTS_MAX_RISK_ROUNDS", "YF_DISABLE_CURL_CFFI"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
binding = "tradingagents_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai-openai-compatible-api-key"
agent_env = "OPENAI_COMPATIBLE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-openai-compatible-api-key"

[[llm_interception.tool_routes]]
host_patterns = ["query1.finance.yahoo.com", "query2.finance.yahoo.com", "fc.yahoo.com", "guce.yahoo.com", "consent.yahoo.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/", "/v1/*", "/v6/*", "/v7/*", "/v8/*", "/v10/*", "/v11/*", "/consent", "/collectConsent"]

[[llm_interception.tool_routes]]
host_patterns = ["www.yahoo.com", "ca.yahoo.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/"]

[[llm_interception.tool_routes]]
host_patterns = ["query1.finance.yahoo.com", "query2.finance.yahoo.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/ws/fundamentals-timeseries/v1/finance/timeseries/*"]

[[llm_interception.tool_routes]]
host_patterns = ["www.sec.gov"]
ports = [443]
methods = ["GET"]
path_patterns = ["/files/company_tickers.json"]

[[llm_interception.tool_routes]]
host_patterns = ["data.sec.gov"]
ports = [443]
methods = ["GET"]
path_patterns = ["/api/xbrl/companyfacts/CIK*.json"]

[[llm_interception.tool_routes]]
host_patterns = ["gamma-api.polymarket.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/public-search"]
