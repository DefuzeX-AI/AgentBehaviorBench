# Hand-written from the pinned Qwen Code CLI's native ACP and OpenAI-compatible provider contracts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "qwen-code"
display_name = "Qwen Code (ACP, Qwen via DashScope)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/QwenLM/qwen-code"
revision = "1026c4a50f4a32f77da98bdacfba2e5faa8cc70a"
downloaded_on = "2026-09-21"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["QWEN_API_BASE_URL", "QWEN_MODEL"]
secret_env_keys = ["DASHSCOPE_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
required = true
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[[llm_interception.credentials]]
id = "dashscope-api-key"
agent_env = "DASHSCOPE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "dashscope-openai-chat"
host_patterns = ["dashscope.aliyuncs.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/compatible-mode/v1/chat/completions"]
protocol_plugin = "openai-chat"
