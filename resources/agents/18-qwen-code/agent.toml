# Programmatically serialized from statically inspected source/deployment facts.
# Static-only integration: full SDK validation and runtime acceptance are pending.
schema_version = "defuzex-bench.agent.v2"
agent_id = "qwen-code"
display_name = "Qwen Code (ACP)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
repository = "https://github.com/QwenLM/qwen-code"
revision = "1026c4a50f4a32f77da98bdacfba2e5faa8cc70a"
downloaded_on = "2026-09-20"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["QWEN_MODEL", "QWEN_BASE_URL"]
secret_env_keys = ["QWEN_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
cwd = "/home/agent/workspace"
permission_policy = "allow_once"
handshake_timeout = 120
evidence_reader = "bootstrap/native_evidence.py:read_calls"

[llm_interception]
required = true
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[[llm_interception.credentials]]
id = "qwen-api-key"
agent_env = "QWEN_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "dashscope-chat"
host_patterns = ["dashscope.aliyuncs.com", "dashscope-intl.aliyuncs.com", "dashscope-us.aliyuncs.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/compatible-mode/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "qwen-api-key"

[[llm_interception.routes]]
id = "dashscope-coding-chat"
host_patterns = ["coding.dashscope.aliyuncs.com", "coding-intl.dashscope.aliyuncs.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "qwen-api-key"
