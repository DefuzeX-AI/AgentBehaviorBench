schema_version = "abb.network.v1"

# OpenHands' local terminal, file editor, and task tracker tools need no network
# routes. The only admitted model route is declared in agent.toml
# [[llm_interception.routes]]. Public skills come from a local git mirror baked
# into the image, and LiteLLM uses its bundled model cost map, so neither
# github.com nor raw.githubusercontent.com is contacted at runtime.
