schema_version = "abb.network.v1"

# Mistral Vibe's file, shell, process, todo and scratchpad tools need no network
# routes. The only admitted model route is the shared runtime default derived from
# the selected provider. Telemetry (and Sentry), update checks, the greeting and
# GrowthBook experiments are switched off in the config.toml written by
# bootstrap/launch.py. No web search, web fetch, MCP or connector tool is offered
# in this deployment; ripgrep is preinstalled for local search.
