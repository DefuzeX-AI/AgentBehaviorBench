# Hand-written from the pinned Mistral Vibe release's native ACP server (`vibe-acp`)
# and its generic OpenAI-compatible provider contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "mistral-vibe"
display_name = "Mistral Vibe (ACP, shared model provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/mistralai/mistral-vibe"
revision = "63d0e8f17e2c1f0d9e1d6f4399ab2dc10fbdf477"
downloaded_on = "2026-10-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = []
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []
