schema_version = "defuzex-bench.agent.v2"
agent_id = "zhisaotong-agent"
display_name = "Zhisaotong Robot Vacuum Support Agent"
framework = "langgraph"

[evaluation]
replay_safe = false

# The upstream checkout is acquired from Git rather than committed, matching
# resources/agents/12-minimax-code and the /resources/agents/*/agent/ rule in
# .gitignore ("Runtime source/install materialization"): prepare_agent_source()
# restores this exact revision into agent/ before an evaluation opens.
[source]
method = "git"
repository = "https://github.com/bamboo-moon/zhisaotong-Agent"
revision = "92569e61ac22ef4d902953a7d916e941921ab92f"
downloaded_on = "2026-10-06"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

# The upstream Agent is built by a Python factory (agent.react_agent.ReactAgent),
# not by a JSON graph descriptor, so the outer binding is the loader entrypoint
# and no adapter config/graph_id is declared.
[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
output_key = "answer"

# Upstream model/factory.py builds ChatTongyi and DashScopeEmbeddings, which speak
# DashScope's native protocol. bindings/bridge.py supplies OpenAI-protocol clients
# instead, so this single route is the Agent's whole model boundary. The RAG
# embedder is a CPU-only ONNX model baked into the image and makes no request.
[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

# get_weather and get_user_location call restapi.amap.com and an IP-echo service.
# No route is declared for either: this deployment has no Amap credential, and the
# upstream code turns those failures into the Chinese error strings it returns to
# the model. The tools stay enabled and degrade exactly as upstream wrote them.
