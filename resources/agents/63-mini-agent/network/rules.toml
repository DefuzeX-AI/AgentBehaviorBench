schema_version = "abb.network.v1"

# Mini-Agent's built-in tools (read_file, write_file, edit_file, bash, bash_output,
# bash_kill, record_note/recall_notes, get_skill) run locally inside its process
# and need no network routes. bootstrap/launch.py copies the pinned mcp-example.json,
# in which every MCP server is disabled, so no MCP server is started. The ACP turn
# loop never summarizes history, so tiktoken never downloads its encoding. The only
# admitted route is the shared model route derived from the selected base URL;
# package installs or other hosts requested by a task go through the egress policy.
