schema_version = "defuzex-bench.agent.v2"
agent_id = "beacon-math-agent"
display_name = "Beacon Math Modeling Agent"
framework = "langgraph"

[evaluation]
replay_safe = false

# The upstream checkout is acquired from Git rather than committed, matching
# resources/agents/12-minimax-code and the /resources/agents/*/agent/ rule in
# .gitignore ("Runtime source/install materialization"): prepare_agent_source()
# restores this exact revision into agent/ before an evaluation opens.
[source]
method = "git"
repository = "https://github.com/123-qw-as/Beacon"
revision = "36b0b7de6774bc619dc39a80a00a41639909d7e9"
downloaded_on = "2026-10-07"

[runtime]
type = "docker"
execution = "oneshot"
# One Input runs the whole 26-node pipeline to a finished paper: the writer
# subflow alone is one outline plus seven section calls per attempt with up to
# three attempts, and the coder runs generated Python for each figure. The
# per-call deadlines in src/math_agent/llm.py (standard 120s, long 240s, code
# 90s, each with its own total deadline) bound a single node's worst case at
# roughly 420s, which is already past the 300s default before the graph has
# finished its first stage.
timeout_sec = 3600
env_keys = [
    "MATH_AGENT_DEFAULT_MODEL",
    "MATH_AGENT_CODER_MODEL",
    "MATH_AGENT_STRONG_MODEL",
    "MATH_AGENT_FIGURE_MODEL",
    "MATH_AGENT_LLM_ATTEMPT_TIMEOUT",
    "MATH_AGENT_LLM_TOTAL_TIMEOUT",
    "MATH_AGENT_MAX_MODEL_ITERATIONS",
    "MATH_AGENT_MAX_WRITER_ITERATIONS",
    "MATH_AGENT_MAX_CODE_VERIFY_ITERATIONS",
    "MATH_AGENT_CODE_TIMEOUT",
    "MATH_AGENT_CODE_MEMORY_LIMIT_MB",
]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

# Upstream ships no langgraph.json: src/math_agent/graph.py exposes the verified
# zero-argument factory build_graph(), which the repository's own harness calls
# directly (scripts/e2e_plan_d.py:186, scripts/e2e_plan_c.py:184) with no
# checkpointer and no interrupt. The outer binding is therefore the entrypoint
# and no config/graph_id is declared.
[adapter]
type = "langgraph"
mode = "in_process"
binding = "bridge.py:create_graph"
input_key = "message"
output_key = "answer"

# Every model call in the deployment leaves through one place: math_agent.llm
# ships requests to a spawned LiteLLM worker (src/math_agent/llm.py -> transport.py
# -> llm_worker.py), and litellm resolves the "openai/..." model names through
# OPENAI_API_BASE into a single POST to the declared host. The node-to-model
# routing table in src/math_agent/config.py (analyst/modeler/critics/writer on the
# strong model, coder on the coder model, figure nodes on the figure model) is a
# choice of name only; the endpoint is the one below for all of them.
[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

# The references section is the only tool that leaves the container:
# src/math_agent/tools/scholar.py GETs the Semantic Scholar search endpoint, and
# src/math_agent/tools/references.py falls back to the bundled
# src/math_agent/references/builtin_library.json when it does not answer 200.
# One documented destination, one path; rate limiting and 5xx are already handled
# upstream by degrading to the static library.
[[llm_interception.tool_routes]]
host_patterns = ["api.semanticscholar.org"]
ports = [443]
methods = ["GET"]
path_patterns = ["/graph/v1/paper/search"]

# Nothing else is declared. The generated Python that the coder writes and runs
# (MATH_AGENT_CODE_TIMEOUT / MATH_AGENT_CODE_MEMORY_LIMIT_MB bound it) is executed
# by src/math_agent/tools/runner.py in a subprocess with a minimal environment, and
# needs only the scientific stack installed in the image. RAG stays off, so the
# embedding endpoint is never contacted.
