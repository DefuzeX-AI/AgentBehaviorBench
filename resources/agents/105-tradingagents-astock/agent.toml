# Manual ABB integration for simonlin1212/TradingAgents-astock (A-share fork).
schema_version = "defuzex-bench.agent.v2"
agent_id = "tradingagents-astock"
display_name = "TradingAgents-astock"
framework = "langgraph"

[evaluation]
replay_safe = false

[source]
method = "git"
repository = "https://github.com/simonlin1212/TradingAgents-astock"
revision = "e3981af1e4c94656cdc663f1466d54fd49253dd5"
downloaded_on = "2026-10-24"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 1800
env_keys = [
  "TRADINGAGENTS_LLM_PROVIDER",
  "TRADINGAGENTS_LLM_BACKEND_URL",
  "TRADINGAGENTS_DEEP_THINK_LLM",
  "TRADINGAGENTS_QUICK_THINK_LLM",
  "TRADINGAGENTS_MAX_DEBATE_ROUNDS",
  "TRADINGAGENTS_MAX_RISK_ROUNDS",
]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
binding = "tradingagents_astock_bridge.py:create_graph"

[llm_interception]
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai-openai-compatible-api-key"
agent_env = "OPENAI_COMPATIBLE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai-openai-compatible-api-key"

# A-share HTTP data vendors used by tradingagents.dataflows.a_stock
[[llm_interception.tool_routes]]
host_patterns = ["qt.gtimg.cn"]
ports = [443]
methods = ["GET"]
path_patterns = ["/q*"]

[[llm_interception.tool_routes]]
host_patterns = [
  "datacenter-web.eastmoney.com",
  "push2.eastmoney.com",
  "push2his.eastmoney.com",
]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/api/*"]

[[llm_interception.tool_routes]]
host_patterns = ["search-api-web.eastmoney.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/search/*"]

[[llm_interception.tool_routes]]
host_patterns = ["np-weblist.eastmoney.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/comm/*"]

[[llm_interception.tool_routes]]
host_patterns = ["basic.10jqka.com.cn"]
ports = [443, 80]
methods = ["GET"]
path_patterns = ["/new/*"]

[[llm_interception.tool_routes]]
host_patterns = ["zx.10jqka.com.cn"]
ports = [443, 80]
methods = ["GET"]
path_patterns = ["/event/*"]

[[llm_interception.tool_routes]]
host_patterns = ["data.hexin.cn"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/market/*"]

[[llm_interception.tool_routes]]
host_patterns = ["money.finance.sina.com.cn"]
ports = [443, 80]
methods = ["GET"]
path_patterns = ["/quotes_service/*"]

[[llm_interception.tool_routes]]
host_patterns = ["quotes.sina.cn"]
ports = [443, 80]
methods = ["GET"]
path_patterns = ["/cn/*"]

[[llm_interception.tool_routes]]
host_patterns = ["vip.stock.finance.sina.com.cn"]
ports = [443, 80]
methods = ["GET"]
path_patterns = ["/corp/*"]

[[llm_interception.tool_routes]]
host_patterns = ["www.cls.cn"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/nodeapi/*"]

[[llm_interception.tool_routes]]
host_patterns = ["finance.pae.baidu.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/api/*"]
