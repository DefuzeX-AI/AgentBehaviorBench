schema_version = "defuzex-bench.agent.v2"
agent_id = "trading-agents"
display_name = "03 TradingAgents"
framework = "langgraph"

[evaluation]
# The market-analysis binding returns advice, executes no orders, and uses temporary local files.
replay_safe = true

[source]
repository = "https://github.com/TauricResearch/TradingAgents"
revision = "be952b8eccb49720509af544c6675233bc1f10d0"
downloaded_on = "2026-09-14"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
secret_env_keys = []

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "request"
output_key = "answer"
binding = "trading.py:create_graph"

[adapter.context]
provider = "openai_compatible"
model = "gpt-4.1-mini"
debate_rounds = 1
risk_rounds = 1
max_tokens = 2500

[adapter.context.research_defaults]
ticker = "AAPL"
date = "2026-09-11"

[observe]
input_fields = [{ name = "ticker", label = "Ticker", required = true }, { name = "date", label = "Date YYYY-MM-DD", required = true }, { name = "request", label = "Research request", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
# Native curl browser impersonation does not survive the transparent TLS proxy.
# yfinance's supported requests backend preserves the same market-data API.
YF_DISABLE_CURL_CFFI = "1"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_COMPATIBLE_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

[[llm_interception.tool_routes]]
host_patterns = ["query1.finance.yahoo.com", "query2.finance.yahoo.com", "fc.yahoo.com", "guce.yahoo.com", "consent.yahoo.com"]
ports = [443]
methods = ["GET", "POST"]
path_patterns = ["/", "/v1/*", "/v6/*", "/v7/*", "/v8/*", "/v10/*", "/v11/*", "/consent", "/collectConsent"]

# Native yfinance follows Yahoo's consent redirect to the homepage.
[[llm_interception.tool_routes]]
host_patterns = ["www.yahoo.com", "ca.yahoo.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/"]

# Ticker.info also fetches complementary fields from this native Yahoo API.
[[llm_interception.tool_routes]]
host_patterns = ["query1.finance.yahoo.com", "query2.finance.yahoo.com"]
ports = [443]
methods = ["GET"]
path_patterns = ["/ws/fundamentals-timeseries/v1/finance/timeseries/*"]
