# Generated by BBA from validated configuration facts.
schema_version = "defuzex-bench.agent.v2"
agent_id = "gemini-cli"
display_name = "Gemini CLI"
framework = "acp"

[evaluation]
replay_safe = false

[source]
repository = "https://github.com/google-gemini/gemini-cli"
revision = "eecccfcd5aff25de5e78135ca20f7abe3f566955"
downloaded_on = "2026-11-21"
method = "git"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300
env_keys = ["GEMINI_CLI_HOME", "GEMINI_TELEMETRY_ENABLED", "GEMINI_TELEMETRY_TRACES_ENABLED", "GEMINI_TELEMETRY_TARGET", "GEMINI_TELEMETRY_OUTFILE", "VERBOSE"]
secret_env_keys = ["GEMINI_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["node", "bundle/gemini.js", "--acp"]
cwd = "/workspace"
permission_policy = "allow_once"

[model]
provider = "gemini"
source = "native"
reason = "This agent is the official command-line interface for the Google Gemini API."

[llm_interception]
trust_plugin = "pem-env"
tool_routes = []

[[llm_interception.credentials]]
id = "gemini"
agent_env = "GEMINI_API_KEY"
auth_plugin = "google-api-key"

[[llm_interception.routes]]
id = "gemini-content"
host_patterns = ["generativelanguage.googleapis.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1beta/models/*:generateContent*", "/v1beta/models/*:streamGenerateContent*"]
protocol_plugin = "gemini-content"
credential = "gemini"
