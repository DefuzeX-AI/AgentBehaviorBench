# Hand-written from the pinned Claurst release binary's native ACP server and OpenAI-compatible provider contract.
schema_version = "defuzex-bench.agent.v2"
agent_id = "claurst"
display_name = "Claurst (ACP, GLM provider)"
framework = "acp"

[evaluation]
replay_safe = false

[evaluation.workspace]
path = "/home/agent/workspace"
initial_state = "empty"

[evaluation.file_evidence]
track_files = true
upload_diff = true
export_changed_files = true

[source]
method = "install"
repository = "https://github.com/Kuberwastaken/claurst"
revision = "0f5d970bd78738434afb0c7abae3350d03246938"
downloaded_on = "2026-09-23"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
env_keys = ["GLM_API_BASE_URL", "GLM_MODEL"]
secret_env_keys = ["GLM_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "acp"
transport = "stdio"
command = ["python", "/opt/agent/bootstrap/launch.py"]
handshake_timeout = 120
cwd = "/home/agent/workspace"
permission_policy = "allow_once"

[llm_interception]
required = true
trust_plugin = "pem-env"
network_config = "network/rules.toml"
tool_routes = []

[[llm_interception.credentials]]
id = "glm-api-key"
agent_env = "GLM_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "glm-openai-chat"
host_patterns = ["open.bigmodel.cn"]
ports = [443]
methods = ["POST"]
path_patterns = ["/api/coding/paas/v4/chat/completions"]
protocol_plugin = "openai-chat"
