[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defuzex-agentbench"
version = "0.1.0"
description = "Benchmark harness and framework adapters for DefuzeX agents."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "python-dotenv>=1,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.30,<2"]
defuzex = ["defuzex>=4,<5"]

[project.scripts]
agentbench = "agentbench.cli.main:cli"

[project.entry-points."defuzex.model_interceptor.trust"]
pem-env = "agentbench.runtime.interception.plugins:PemEnvironmentTrust"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbench*"]

[tool.setuptools.package-data]
"agentbench.services" = [
    "model-interceptor/.dockerignore",
    "model-interceptor/Dockerfile",
    "model-interceptor/README.md",
    "model-interceptor/pyproject.toml",
    "model-interceptor/src/defuzex_model_interceptor/*.py",
    "model-interceptor/src/defuzex_model_interceptor/**/*.py",
    "model-interceptor/src/model/*.py",
    "model-interceptor/src/model/**/*.py",
]

[tool.pytest.ini_options]
cache_dir = "cache/pytest"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
